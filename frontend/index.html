<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DTCC Dataset Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>DTCC Dataset Downloader</h1>
    </header>
    <div id="controls">
      <button id="draw-bbox">Draw Bounding Box</button>
      <button id="clear-bbox">Clear</button>
    </div>
    <div id="map" class="map-container"></div>
    <div id="bbox-tooltip" class="bbox-tooltip"></div>
    <div id="dataset-dialog" class="dataset-dialog">
      <div class="dataset-dialog-content">
        <h3>Select dataset to download</h3>
        <div id="dataset-buttons" class="dataset-buttons"></div>
      </div>
    </div>
    <div id="info">
      <h3>Selected Area (EPSG:3006)</h3>
      <pre id="coordinates">No area selected</pre>
      <p id="help-text" class="help-text">
        Click "Draw Bounding Box" to start. Then click and drag on the map. After drawing, drag corners or edges to resize. Click "Clear" to draw a new box.
      </p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
