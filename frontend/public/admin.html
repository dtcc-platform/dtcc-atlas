<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTCC Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-700">
            <h1 class="text-2xl font-bold text-white">DTCC Admin</h1>
            <button onclick="refreshAll()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium transition-colors">
                Refresh
            </button>
        </header>

        <!-- Published Datasets Section -->
        <section class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold">
                    Published Datasets
                    <span id="datasets-summary" class="text-sm font-normal text-gray-400"></span>
                </h2>
            </div>
            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-700">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Name</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Features</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Size</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Updated</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="datasets-table" class="divide-y divide-gray-700">
                        <tr>
                            <td colspan="5" class="px-4 py-8 text-center text-gray-400">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Download and Orders Section -->
        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <!-- Download New Order -->
            <section class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-lg font-semibold mb-4">Download New Order</h2>
                <form id="download-form" onsubmit="downloadOrder(event)">
                    <div class="mb-4">
                        <label for="order-id" class="block text-sm font-medium text-gray-300 mb-2">Order ID</label>
                        <input
                            type="text"
                            id="order-id"
                            name="order_id"
                            placeholder="Enter Geotorget order UUID"
                            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </div>
                    <button
                        type="submit"
                        id="download-btn"
                        class="w-full px-4 py-2 bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed rounded font-medium transition-colors"
                    >
                        Download
                    </button>
                </form>
            </section>

            <!-- Downloaded Orders -->
            <section class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-lg font-semibold mb-4">Downloaded Orders</h2>
                <div id="orders-list" class="space-y-3 max-h-64 overflow-y-auto">
                    <p class="text-gray-400 text-sm">Loading...</p>
                </div>
            </section>
        </div>

        <!-- Status Bar -->
        <footer class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 px-4 py-3">
            <div class="container mx-auto max-w-6xl flex items-center">
                <span class="text-sm text-gray-400">Status:</span>
                <span id="status-text" class="ml-2 text-sm text-gray-300">Ready</span>
                <span id="status-spinner" class="ml-2 hidden"><span class="spinner"></span></span>
            </div>
        </footer>
    </div>

    <script>
        const API_BASE = '/api/v1/admin';

        function setStatus(text, loading = false) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-spinner').classList.toggle('hidden', !loading);
        }

        function formatDate(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        }

        function formatNumber(num) {
            return num.toLocaleString();
        }

        function createTextElement(tag, text, className) {
            const el = document.createElement(tag);
            el.textContent = text;
            if (className) el.className = className;
            return el;
        }

        async function fetchDatasets() {
            try {
                const response = await fetch(`${API_BASE}/datasets`);
                const data = await response.json();
                renderDatasets(data);
            } catch (error) {
                console.error('Failed to fetch datasets:', error);
                setStatus('Failed to load datasets');
            }
        }

        function renderDatasets(data) {
            const summary = document.getElementById('datasets-summary');
            summary.textContent = `(${data.total_count} datasets, ${data.total_size_mb} MB)`;

            const tbody = document.getElementById('datasets-table');
            tbody.replaceChildren();

            if (data.datasets.length === 0) {
                const tr = document.createElement('tr');
                const td = createTextElement('td', 'No published datasets', 'px-4 py-8 text-center text-gray-400');
                td.colSpan = 5;
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
            }

            data.datasets.forEach(ds => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/50';

                // Name cell
                const nameCell = document.createElement('td');
                nameCell.className = 'px-4 py-3';
                const nameDiv = createTextElement('div', ds.name, 'font-medium text-white');
                const titleDiv = createTextElement('div', ds.title, 'text-xs text-gray-400');
                nameCell.appendChild(nameDiv);
                nameCell.appendChild(titleDiv);
                tr.appendChild(nameCell);

                // Features cell
                tr.appendChild(createTextElement('td', formatNumber(ds.feature_count), 'px-4 py-3 text-gray-300'));

                // Size cell
                tr.appendChild(createTextElement('td', ds.size_mb + ' MB', 'px-4 py-3 text-gray-300'));

                // Updated cell
                tr.appendChild(createTextElement('td', formatDate(ds.updated), 'px-4 py-3 text-gray-300 text-sm'));

                // Actions cell
                const actionsCell = document.createElement('td');
                actionsCell.className = 'px-4 py-3';
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'px-2 py-1 bg-red-600 hover:bg-red-700 rounded text-xs font-medium transition-colors';
                deleteBtn.addEventListener('click', () => deleteDataset(ds.name));
                actionsCell.appendChild(deleteBtn);
                tr.appendChild(actionsCell);

                tbody.appendChild(tr);
            });
        }

        async function fetchOrders() {
            try {
                const response = await fetch(`${API_BASE}/orders`);
                const data = await response.json();
                renderOrders(data.orders);
            } catch (error) {
                console.error('Failed to fetch orders:', error);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');
            container.replaceChildren();

            if (orders.length === 0) {
                container.appendChild(createTextElement('p', 'No downloaded orders', 'text-gray-400 text-sm'));
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'bg-gray-700 rounded p-3';

                const topRow = document.createElement('div');
                topRow.className = 'flex justify-between items-start mb-2';

                const orderId = document.createElement('div');
                orderId.className = 'text-sm font-mono text-gray-300 truncate flex-1 mr-2';
                orderId.title = order.order_id;
                orderId.textContent = order.order_id.substring(0, 20) + '...';
                topRow.appendChild(orderId);

                const publishBtn = document.createElement('button');
                publishBtn.textContent = 'Publish';
                publishBtn.className = 'px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-xs font-medium transition-colors whitespace-nowrap';
                publishBtn.addEventListener('click', () => publishOrder(order.order_id));
                topRow.appendChild(publishBtn);

                card.appendChild(topRow);

                let infoText = `${order.file_count} files | ${order.size_mb} MB`;
                if (order.download_date) {
                    infoText += ' | ' + formatDate(order.download_date);
                }
                card.appendChild(createTextElement('div', infoText, 'text-xs text-gray-400'));

                container.appendChild(card);
            });
        }

        async function downloadOrder(event) {
            event.preventDefault();

            const input = document.getElementById('order-id');
            const btn = document.getElementById('download-btn');
            const orderId = input.value.trim();

            if (!orderId) {
                setStatus('Please enter an order ID');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Downloading...';
            setStatus(`Downloading order ${orderId.substring(0, 8)}...`, true);

            try {
                const response = await fetch(`${API_BASE}/orders/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: orderId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Download failed');
                }

                setStatus(`Downloaded ${data.files_downloaded} files (${data.size_mb} MB)`);
                input.value = '';
                fetchOrders();
            } catch (error) {
                setStatus(`Error: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Download';
            }
        }

        async function publishOrder(orderId) {
            if (!confirm(`Publish order ${orderId.substring(0, 8)}...?`)) {
                return;
            }

            setStatus(`Publishing order ${orderId.substring(0, 8)}...`, true);

            try {
                const response = await fetch(`${API_BASE}/orders/${orderId}/publish`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Publish failed');
                }

                setStatus(`Published ${data.count} datasets`);
                fetchDatasets();
            } catch (error) {
                setStatus(`Error: ${error.message}`);
            }
        }

        async function deleteDataset(name) {
            if (!confirm(`Delete dataset "${name}"? This cannot be undone.`)) {
                return;
            }

            setStatus(`Deleting ${name}...`, true);

            try {
                const response = await fetch(`${API_BASE}/datasets/${name}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Delete failed');
                }

                setStatus(`Deleted ${name}`);
                fetchDatasets();
            } catch (error) {
                setStatus(`Error: ${error.message}`);
            }
        }

        function refreshAll() {
            setStatus('Refreshing...', true);
            Promise.all([fetchDatasets(), fetchOrders()])
                .then(() => setStatus('Ready'))
                .catch(() => setStatus('Refresh failed'));
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
        });
    </script>
</body>
</html>
